name: Validate release

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile deployment modules
        run: |
          python -m py_compile deployment/*.py

      - name: Verify release hashes
        run: python deployment/uomind_infer.py --bundle . --verify-only

      - name: Run deterministic identity smoke test
        run: >-
          python deployment/uomind_infer.py
          --bundle .
          --device cpu
          --temperature 0
          --max-new-tokens 24
          --state "Your name is Mira. You are a baker in Britain."
          --player "Who are you?"
