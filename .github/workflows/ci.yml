name: Validate release

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile package Python files
        run: |
          python -m py_compile deployment/*.py training/*.py

      - name: Verify release hashes
        run: python deployment/uomind_infer.py --bundle . --verify-only

      - name: Run one-step fine-tuning smoke test
        run: >-
          python training/uomind_repair_finetune_v3.py
          --bundle .
          --checkpoint model/v9_base_finetune.pt
          --allow-source-mismatch
          --corpus-dir training/corpus
          --corpus-glob example_custom_task.jsonl
          --require-manifests
          --output-dir /tmp/npcmicro13m-ci
          --smoke-test
          --smoke-steps 1
          --max-steps 1
          --device cpu
          --train-last-n-layers 1
